name: Docker Image CI

permissions:
  contents: read
  packages: write

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MANIFESTS_NAME: ${{ github.repository }}-manifests

jobs:
  # Static site: standard runners + QEMU is enough (no self-hosted ARM).
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved VERSION=${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          test -n "${VERSION}" || { echo "VERSION empty"; exit 1; }
          echo "Using VERSION=${VERSION}"

      - name: Setup Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: "0.32.0"

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@v2.6.4

      - name: Resolve project dependencies
        run: |
          pkl project resolve schema
          pkl project resolve configs

      - name: Generate manifests
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          mkdir -p dist
          pkl eval --project-dir configs configs/prod.pkl > dist/manifests.yaml
          # Flux Kustomization runs kustomize build — plain YAML alone is ignored/fails.
          cat > dist/kustomization.yaml <<'KUST'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - manifests.yaml
          KUST
          # strip leading spaces from heredoc body if any
          sed -i 's/^          //' dist/kustomization.yaml
          echo "---- image pin ----"
          grep -E '^\s+image:' dist/manifests.yaml
          test -s dist/manifests.yaml
          test -s dist/kustomization.yaml
          cat dist/kustomization.yaml

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Flux OCI artifact
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          ARTIFACT_URL="${REGISTRY}/${MANIFESTS_NAME}"
          echo "Pushing oci://${ARTIFACT_URL}:${VERSION}"
          flux push artifact "oci://${ARTIFACT_URL}:${VERSION}" \
            --path=./dist \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${VERSION}@sha1:${GITHUB_SHA}" \
            --annotations="org.opencontainers.image.version=${VERSION}" \
            --annotations="org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotations="org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          echo "Pushed Flux OCI artifact: oci://${ARTIFACT_URL}:${VERSION}"

      - name: Upload manifests (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: manifests-${{ steps.ver.outputs.version }}
          path: dist/manifests.yaml
          if-no-files-found: error
