name: Pkl Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: '0.27.1'

      - name: Extract config package version
        id: config-version
        working-directory: schema
        run: |
          VERSION=$(grep 'version = ' PklProject | sed 's/.*version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Config package version: $VERSION"

      - name: Package config
        working-directory: schema
        run: pkl project package --output-path ../dist

      - name: List generated files
        run: ls -la dist/

      - name: Create config package tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin :refs/tags/config@${{ steps.config-version.outputs.version }} || true
          git tag -fa "config@${{ steps.config-version.outputs.version }}" -m "Config package v${{ steps.config-version.outputs.version }}"
          git push origin "config@${{ steps.config-version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: config@${{ steps.config-version.outputs.version }}
          name: config@${{ steps.config-version.outputs.version }}
          files: |
            dist/config@*
          body: |
            Pkl configuration schema for onlyturbofans v${{ steps.config-version.outputs.version }}

            ## Installation

            ```pkl
            dependencies {
              ["config"] {
                uri = "package://pkg.pkl-lang.org/github.com/bmurray/onlyturbofans/config@${{ steps.config-version.outputs.version }}"
              }
            }
            ```

            Triggered by ${{ github.ref_name }}
