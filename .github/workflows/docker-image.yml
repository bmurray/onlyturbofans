name: Docker Image CI

permissions:
  contents: read
  packages: write

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Separate OCI package for Flux manifests (not the container image)
  MANIFESTS_NAME: ${{ github.repository }}-manifests

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: [self-hosted, macOS, ARM64]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          # Self-hosted runners retain /tmp across jobs — never accumulate digests.
          DIGEST_DIR="${{ runner.temp }}/digests"
          rm -rf "$DIGEST_DIR"
          mkdir -p "$DIGEST_DIR"
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          # Single file named by digest; contents unused, name is the payload.
          : > "$DIGEST_DIR/${digest#sha256:}"
          echo "Exported digest: $digest"
          ls -la "$DIGEST_DIR"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          # Fail if more than one digest snuck in (stale runner /tmp)
          # enforced in merge job; upload is per-platform

  merge:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          # v1.2.3 → 1.2.3 (matches docker/metadata-action semver tags)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved VERSION=${VERSION}"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          echo "Digest files from build matrix:"
          ls -la
          count=$(find . -maxdepth 1 -type f ! -name '.*' | wc -l | tr -d ' ')
          echo "Digest count: $count (expected 2: amd64 + arm64)"
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected exactly 2 platform digests, found $count. Stale digests from a self-hosted runner?"
            exit 1
          fi
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

  # After the image is published, render pkl → YAML and push a Flux OCI artifact
  # so OCIRepository can track new semver tags automatically.
  manifests:
    runs-on: ubuntu-latest
    needs: merge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          test -n "${VERSION}" || { echo "VERSION empty"; exit 1; }
          echo "Using VERSION=${VERSION}"

      - name: Setup Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: "0.32.0"

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@v2.6.4

      - name: Resolve project dependencies
        run: |
          pkl project resolve schema
          pkl project resolve configs

      - name: Generate manifests
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          mkdir -p dist
          pkl eval --project-dir configs configs/prod.pkl > dist/manifests.yaml
          echo "---- image pin ----"
          grep -E '^\s+image:' dist/manifests.yaml
          test -s dist/manifests.yaml

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Flux OCI artifact
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          # Full X.Y.Z only (from git tag vX.Y.Z). Do not also tag major.minor —
          # that produces non-semver tags like 0.1 which break Flux ref.semver.
          ARTIFACT_URL="${REGISTRY}/${MANIFESTS_NAME}"
          echo "Pushing oci://${ARTIFACT_URL}:${VERSION}"
          flux push artifact "oci://${ARTIFACT_URL}:${VERSION}" \
            --path=./dist \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${VERSION}@sha1:${GITHUB_SHA}" \
            --annotations="org.opencontainers.image.version=${VERSION}" \
            --annotations="org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotations="org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          echo "Pushed Flux OCI artifact: oci://${ARTIFACT_URL}:${VERSION}"

      - name: Upload manifests (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: manifests-${{ steps.ver.outputs.version }}
          path: dist/manifests.yaml
          if-no-files-found: error
